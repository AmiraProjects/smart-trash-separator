<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" type="text/css" href="style.css">
    <link href="fontawesome-free-6.5.1-web/css/all.css" rel="stylesheet" type="text/css"></link>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Marck+Script&family=Poetsen+One&family=Tillana:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="main-header">
            <h3 class="info-header"><i class="fa-solid fa-earth-americas" id="icon"></i>Smart Trash Separator</h3>
            <nav>
                <a href="index.html">Home</a>
                <a href="contact.html">Contacts</a>
                <a href="about.html">About</a>
            </nav>
        </div>
    </header>
    <main>
        <div class="contact-container">
            <div class="illustration">
                <img class="illustration-img" src="assets/contact 1.jpg" alt="" width="800px">
            </div>
            <div class="contact">
                <img class="profile-contact-img" src="assets/profile pic.png" alt="">
                <h1>Contact Me!</h1>
                <p>Please feel free to contact me!</p>
                <h4>Your Information</h4>
                <form action="https://formsubmit.co/amira.n.rachman@gmail.com" autocomplete="off" method="post">
                    <input type="hidden" name="_captcha" value="false">
                    <input type="hidden" name="_next" class="next">
                    <div class="form-container">
                        <div class="input-container">
                            <div class="icon">
                                <i class="fas fa-user"></i>
                            </div>
                            <div class="form-input">
                                <input class="input-item" type="text" id="name" name="name" placeholder=" ">
                                <label for="name" class="form-label">Name</label>
                            </div>
                        </div>
    
                        <div class="input-container">
                            <div class="icon">
                                <i class="fas fa-map-marker-alt"></i>
                            </div>
                            <div class="form-input">
                                <input class="input-item" type="text" id="city" name="city" placeholder=" ">
                                <label for="city" class="form-label">City</label>
                            </div>
                        </div>
    
                        <div class="input-container">
                            <div class="icon">
                                <i class="far fa-envelope-open"></i>
                            </div>
                            <div class="form-input">
                                <input class="input-item" type="text" id="email" name="email" placeholder=" ">
                                <label for="email" class="form-label">Email</label>
                            </div>
                        </div>
    
                        <div class="textarea-container">
                            <div class="icon">
                                <i class="fas fa-comment"></i>
                            </div>
                            <div class="form-textarea">
                                <textarea class="textarea" type="text" name="message" id="message" cols="52" rows="8" placeholder=" "></textarea>
                                <label for="message" class="form-label">Message/Suggestions</label>
                            </div>
                        </div>
                    </div>
    
                    <input type="submit" value="Submit" class="submit">
                </form>
            </div>
        </div>
        <div class="modal-container">
            <div class="modal">
                <img src="assets/happy earth.png" alt="">
                <h3>Message Sent!</h3>
                <p>Thanks for Your Suggestions!</p>
            </div>
        </div>
    </main>
    <footer>
        <div class="center-footer">
            <div class="main-footer">
                <div class="left-footer">
                    <h3 class="info-left"><i class="fas fa-map-marked-alt"></i><b>Adress</b></h3>
                    <p class="info-left"><i class="fas fa-map-pin"></i>Indonesia</p>
                </div>
                
                <div class="right-footer">
                    <h3 class="info-right"><i class="fas fa-address-book"></i><b>Contacts</b></h3>
                    <p class="info-right"><i class="fab fa-whatsapp"></i>Phone : 0812-9145-6158</p>
                    <p class="info-right"><i class="fab fa-instagram"></i>Instagram : @amira_b_aja</p>
                </div>
            </div>

            <div class="main-footer">
                <p class="info-center">
                    Copyright &copy; 2024 Made by Amira
                </p>
            </div>
        </div>
    </footer>
    <script src="script.js"></script>
</body>
</html>
